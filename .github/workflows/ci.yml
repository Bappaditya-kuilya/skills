name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Syntax check scripts
        shell: bash
        run: for f in bin/*.mjs */scripts/*.mjs; do node --check "$f" && echo "ok $f"; done

      - name: Validate SKILL.md frontmatter
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const dirs = fs.readdirSync(".", { withFileTypes: true })
              .filter((d) => d.isDirectory() && fs.existsSync(`${d.name}/SKILL.md`)).map((d) => d.name);
            if (!dirs.length) throw new Error("no skills found");
            for (const d of dirs) {
              const fm = fs.readFileSync(`${d}/SKILL.md`, "utf8").match(/^---\r?\n([\s\S]*?)\r?\n---/);
              if (!fm) throw new Error(`${d}: missing frontmatter`);
              const name = fm[1].match(/^name:\s*(.+)$/m)?.[1].trim();
              const desc = fm[1].match(/^description:\s*(.+)$/m)?.[1].trim();
              if (name !== d) throw new Error(`${d}: name "${name}" must match folder`);
              if (!desc || desc.length > 1024) throw new Error(`${d}: description missing or over 1024 chars`);
              console.log(`ok ${d}`);
            }'

      - name: Installer smoke test
        shell: bash
        run: |
          node bin/install.mjs --help
          node bin/install.mjs --list
          node bin/install.mjs --dir ./test-output
          test -f test-output/awwwards/SKILL.md
          test -f test-output/awwwards/scripts/audit.mjs
          node bin/install.mjs awwwards --dir ./test-output --uninstall
          test ! -e test-output/awwwards
          if node bin/install.mjs nope --dir ./test-output; then exit 1; fi

      - name: Package contents
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: npm pack --dry-run
